<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator</title>
</head>
<body>
    <h1>QR Code Generator</h1>

    <label for="qrText">Enter text or URL:</label>
    <input type="text" id="qrText" placeholder="https://example.com">

    <button onclick="generateQR()">Generate QR Code</button>

    <p id="message"></p>

    <div id="qrcode"></div>

    <button onclick="downloadQR()">Download QR Code</button>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <script>
        let qr;

        function generateQR() {
            const text = document.getElementById("qrText").value.trim();
            const container = document.getElementById("qrcode");
            const message = document.getElementById("message");

            container.innerHTML = "";
            message.textContent = "";

            if (!text) {
                message.textContent = "Please enter some text or a URL.";
                return;
            }

            if (typeof QRCode === "undefined") {
                message.textContent =
                    "QR library failed to load. Check your internet connection.";
                return;
            }

            qr = new QRCode(container, {
                text: text,
                width: 200,
                height: 200,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });

            message.textContent = "QR code generated successfully!";
        }

        function downloadQR() {
            const container = document.getElementById("qrcode");
            const canvas = container.querySelector("canvas");
            const image = container.querySelector("img");

            if (canvas) {
                saveImage(canvas.toDataURL("image/png"));
            } else if (image && image.src) {
                saveImage(image.src);
            } else {
                document.getElementById("message").textContent =
                    "Generate a QR code first.";
            }
        }

        function saveImage(dataURL) {
            const link = document.createElement("a");
            link.href = dataURL;
            link.download = "qrcode.png";
            link.click();
        }
    </script>
</body>
</html>
